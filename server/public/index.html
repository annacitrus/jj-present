<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw to Frame</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding-block: 24px;
    padding-inline: 16px;
    background: #1b1b1f;
    color: #eee;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
  #canvasWrap {
    border: 2px solid #444;
    border-radius: 6px;
    line-height: 0;
    max-width: 100%;
    overflow: auto;
    touch-action: none;
  }
  canvas { background: #000; display: block; touch-action: none; max-width: 100%; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
  }
  .controls label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
  button {
    font-size: 0.95rem;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #2a2a30;
    color: #eee;
    cursor: pointer;
  }
  button:hover { background: #38383f; }
  #sendBtn { background: #2d6cdf; border-color: #2d6cdf; font-weight: 600; }
  #sendBtn:hover { background: #3a7bf0; }
  #status { font-size: 0.85rem; opacity: 0.8; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Draw something, send it to the frame</h1>

<div id="canvasWrap">
  <canvas id="draw" width="640" height="480"></canvas>
</div>

<div class="controls">
  <label>Color <input type="color" id="color" value="#ffffff"></label>
  <label>Brush <input type="range" id="brush" min="1" max="20" value="4"></label>
  <button id="clearBtn">Clear</button>
  <button id="sendBtn">Send to Frame</button>
</div>

<div id="status"></div>

<script>
const canvas = document.getElementById('draw');
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#000';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.lineCap = 'round';
ctx.lineJoin = 'round';

const colorInput = document.getElementById('color');
const brushInput = document.getElementById('brush');
const statusEl = document.getElementById('status');

let drawing = false;
let lastX = 0, lastY = 0;

function pos(evt) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return [(evt.clientX - rect.left) * scaleX, (evt.clientY - rect.top) * scaleY];
}

canvas.addEventListener('pointerdown', (e) => {
  drawing = true;
  [lastX, lastY] = pos(e);
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  const [x, y] = pos(e);
  ctx.strokeStyle = colorInput.value;
  ctx.lineWidth = Number(brushInput.value) * 2; // *2 since canvas is drawn at 2x target res
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(x, y);
  ctx.stroke();
  [lastX, lastY] = [x, y];
});
window.addEventListener('pointerup', () => { drawing = false; });

document.getElementById('clearBtn').addEventListener('click', () => {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
});

document.getElementById('sendBtn').addEventListener('click', async () => {
  statusEl.textContent = 'Sending…';
  try {
    const buf = toRGB565();
    const res = await fetch('/api/image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: buf,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    statusEl.textContent = `Sent (version ${data.version}). The frame will pick it up shortly.`;
  } catch (err) {
    statusEl.textContent = `Failed to send: ${err.message}`;
  }
});

// Downscale the drawing canvas to the display's native 320x240 and
// pack it into big-endian RGB565 bytes, matching what the firmware expects.
function toRGB565() {
  const W = 320, H = 240;
  const off = document.createElement('canvas');
  off.width = W;
  off.height = H;
  const offCtx = off.getContext('2d');
  offCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, W, H);
  const { data } = offCtx.getImageData(0, 0, W, H);

  const out = new Uint8Array(W * H * 2);
  for (let i = 0, p = 0; i < data.length; i += 4, p += 2) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const rgb565 = ((r & 0xf8) << 8) | ((g & 0xfc) << 3) | (b >> 3);
    out[p] = (rgb565 >> 8) & 0xff; // big-endian
    out[p + 1] = rgb565 & 0xff;
  }
  return out;
}
</script>
</body>
</html>
